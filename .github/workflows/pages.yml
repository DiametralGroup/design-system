name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; let an in-progress run finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci || npm i

      # The React layer is authored in TSX and served from the emit, so the site
      # cannot be assembled from the working tree alone any more. It is also a
      # hard prerequisite for site/: its `file:..` install resolves
      # `dist/diametral.css` through the package's own exports map, and dist/ is
      # gitignored, so a fresh checkout has no stylesheet until this runs.
      - name: Build the package
        run: npm run build

      # site/ is deliberately not a workspace member — its ~15 devDeps must
      # never reach the zero-dep package's resolution graph — so it installs
      # and builds on its own.
      - name: Install site/
        run: cd site && npm ci || npm i

      # build-demo-markup.mjs (part of `npm run build`) launches headless
      # Chromium to scrape rendered demo markup, not just the test suites.
      - name: Install Chromium
        run: cd site && npx playwright install --with-deps chromium

      - name: Build site/
        run: npm --prefix site run build

      - name: Assemble _site
        run: |
          set -euo pipefail
          mkdir -p _site
          # site/'s own build output IS the site (issue #47 / direction.md
          # decision 6): it owns `/` directly, not a `/react-workbench/`
          # subpath — the buildless showcase this workflow used to serve at
          # root retired with it. Its hashed bundles are self-contained
          # (vite.config.ts `base: "/design-system/"`), so nothing else needs
          # copying alongside them.
          cp -r site/dist/* _site/

          # SPA fallback: Pages serves the site-root 404.html for any
          # unmatched path, so a deep link only survives a reload if that
          # file is the app's own index.
          cp _site/index.html _site/404.html

          # Disable Jekyll processing.
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
