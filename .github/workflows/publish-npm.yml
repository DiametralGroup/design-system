name: Publish to npm (public)

# Publishes @diametral/design-system to the PUBLIC npm registry
# (registry.npmjs.org) so anyone can `npm i @diametral/design-system` with
# no auth. Authenticates through npm Trusted Publishing (OIDC) — no token
# secret. Triggered by publishing a
# GitHub Release, or manually. See RELEASE.md.
#
# DIST-TAG. A prerelease version (one carrying a `-` — `1.0.0-beta.3`) publishes
# to `next`; a stable version publishes to `latest`. This is what keeps the v1
# absorption betas off `latest` while `main` stays at 0.11.0: a bare
# `npm publish` would move `latest` to a beta on the first tag.

on:
  push:
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # for npm provenance

# Serialize, don't cancel: a second run must not race an in-flight `npm publish`
# and leave a half-published version.
concurrency:
  group: ${{ github.workflow }}

jobs:
  publish:
    runs-on: ubuntu-latest
    # The npm Trusted Publisher is bound to this environment name: renaming or
    # dropping it breaks the publish.
    environment: default
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
          scope: "@diametral"

      # `npm run build` starts with `build:react` (tsc), which resolves react's
      # types from node_modules — without this the whole React layer fails to
      # compile with TS2307. Same idiom as ci.yml.
      - run: npm ci || npm i

      - name: Build distributable artifacts
        run: npm run build

      - name: Resolve the dist-tag from the version
        id: disttag
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          case "$version" in
            *-*) tag=next ;;
            *)   tag=latest ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "::notice::Publishing $version to dist-tag '$tag'."

      # Trusted Publishing (OIDC): npm trusts this workflow of
      # DiametralGroup/design-system directly, so no NPM_TOKEN is involved —
      # the @diametral scope requires 2FA, which a token cannot carry, and
      # tokens expire. Configured on npmjs.com under the package's Settings →
      # Trusted Publisher (workflow publish-npm.yml, environment default).
      # Needs npm >= 11.5.1; node 20 ships npm 10.
      - name: Install an npm that supports trusted publishing
        run: npm install -g npm@11

      - name: Publish (public, with provenance)
        run: npm publish --access public --provenance --tag "${{ steps.disttag.outputs.tag }}"
