name: CI

# Typecheck, build and assert the contracts on every push and PR. Then pack the
# package and install the tarball into a throwaway project, because the in-repo
# build passes even when the *published* artifact is broken — a wrong exports
# map and an extensionless ESM specifier both fail only for an external consumer.

on:
  push:
    branches: [main, v1]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci || npm i

      - run: npm run typecheck

      - run: npm run build

      # Release-blocking: ds-* class resolution, non-React layer import purity,
      # and the @layer invariant guard. See scripts/check-contracts.mjs.
      - name: Contract checks
        run: node scripts/check-contracts.mjs

  # site/ is load-bearing: it IS the verification gate every absorption batch is
  # checked against, so it can never be dropped, left broken, or excluded here.
  # As a deliverable it is a PR check, not a release gate — the components it
  # renders are release-gated by their own batch.
  site:
    runs-on: ubuntu-latest
    # Measured on a real run: build+typecheck+Chromium+site-build ~3m, the
    # a11y step alone ~14m, and the regress suite below didn't finish in the
    # 8.5m left of a 25m budget. 45m leaves real margin for both suites.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm ci || npm i

      # A hard prerequisite, not an ordering preference: site/ installs the
      # package as `file:..` and imports `dist/diametral.css` through its real
      # exports map, and dist/ is gitignored.
      - name: Build the package
        run: npm run build

      # Not a workspace member on purpose — its ~15 devDeps must never reach the
      # zero-dep package's resolution graph.
      - name: Install site/
        run: cd site && npm ci || npm i

      - name: Typecheck site/
        run: npm --prefix site run typecheck

      # build-demo-markup.mjs (part of `npm run build`) launches headless
      # Chromium to scrape rendered demo markup, not just the test suites
      # below — this has to run before the build, not after it.
      - name: Install Chromium
        run: cd site && npx playwright install --with-deps chromium

      - name: Build site/
        run: npm --prefix site run build

      # Reports rather than blocks, for now. The violations it finds are in the
      # held components themselves — the picker `aria-allowed-attr` cluster, the
      # Segmented dark-theme contrast pair, TagInput's unlabelable input — and
      # batch 0.3 owns those fixes. Flip `continue-on-error` off in 0.3, once
      # its in-place a11y work lands and the suite is green.
      - name: Accessibility gate over the landed components
        id: a11y
        continue-on-error: true
        run: npm --prefix site run test:a11y

      - name: Upload the a11y report
        if: steps.a11y.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: site-a11y-report
          path: |
            site/playwright-report/
            site/test-results/
          retention-days: 14
          if-no-files-found: ignore

      # Per-component behavior-regression specs. Same reporting posture as the
      # a11y gate above: corrections.md records a pre-existing failure set
      # (toggle focus-visible, autocomplete, phone-input, color-picker, ...)
      # this isn't the place to chase, so report rather than block for now.
      - name: Behavior regression suite
        id: regress
        continue-on-error: true
        run: npm --prefix site run test:regress

      - name: Upload the regression report
        if: steps.regress.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: site-regress-report
          path: |
            site/playwright-report/
            site/test-results/
          retention-days: 14
          if-no-files-found: ignore

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci || npm i

      - name: Pack
        run: npm pack --pack-destination /tmp

      # The entry points a consumer actually imports — `@diametral/design-system/react`
      # and the CSS the barrel depends on. Both are gitignored (dist/) or easy to
      # drop from `files` without the in-repo build noticing (#156 decision 5).
      - name: Assert the react barrel and stylesheet ship in the tarball
        run: |
          missing=0
          for f in dist/react/index.js css/diametral.css; do
            if ! tar tzf /tmp/diametral-design-system-*.tgz | grep -qx "package/$f"; then
              echo "::error::package/$f is missing from the tarball."
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] && echo "dist/react/index.js and css/diametral.css are both in the tarball."
          exit "$missing"

      # Ufficio is commercial and its licence requires offline-only storage
      # (NOTICE.md). Today it is kept out of the tarball by .npmignore alone —
      # one deleted line away from shipping. This asserts it.
      - name: Assert no commercial font binary ships
        run: |
          if tar tzf /tmp/diametral-design-system-*.tgz | grep -iE '\.(woff2?|otf|ttf)$'; then
            echo "::error::A font binary is present in the tarball. Ufficio is commercial and must never be distributed (see NOTICE.md)."
            exit 1
          fi
          echo "No font binaries in the tarball."

      - name: Install the tarball as an external consumer
        run: |
          mkdir -p /tmp/consumer/src && cd /tmp/consumer
          echo '{"name":"consumer","private":true,"type":"module"}' > package.json
          cat > tsconfig.json <<'JSON'
          { "compilerOptions": { "target":"ES2022","lib":["ES2022","DOM"],"module":"ESNext",
            "moduleResolution":"bundler","jsx":"react-jsx","strict":true,"noEmit":true,
            "skipLibCheck":true }, "include":["src"] }
          JSON
          cat > src/app.tsx <<'TSX'
          import { Button, Card, StatusPanel, cx } from "@diametral/design-system/react"
          export const App = () => (
            <Card className={cx("ds-card")}>
              <StatusPanel status="warning" kicker="Approval" heading="Manager review" />
              <Button variant="primary">Escalate</Button>
            </Card>
          )
          TSX
          npm install --no-audit --no-fund react@18 react-dom@18 @types/react@18 \
            @types/react-dom@18 typescript /tmp/diametral-design-system-*.tgz

      # The peer range is `>=18` and no React-19-only API is used. This is the
      # compile that keeps that claim honest (#155 decision 3).
      - name: Consumer typechecks against the tarball on React 18
        run: cd /tmp/consumer && npx tsc --noEmit

      - name: Consumer resolves the package under plain Node ESM
        run: |
          cd /tmp/consumer
          node --input-type=module -e "
            import('@diametral/design-system/react')
              .then(() => console.log('Node ESM resolution OK'))
              .catch(e => { console.error('Node ESM resolution FAILED:', e.code); process.exit(1) })
          "

      # The parity guarantee is a property of the *shipped* artifact, not the
      # working tree: a class that resolves in-repo but whose stylesheet never
      # makes the tarball is exactly the failure this is here to stop.
      - name: Every ds-* class the tarball renders resolves in the tarball's CSS
        run: |
          cd /tmp/consumer
          node --input-type=module -e "
            import { createRequire } from 'node:module'
            const require = createRequire(process.cwd() + '/')
            const root = require.resolve('@diametral/design-system/css/diametral.css')
            console.log('stylesheet present:', root)
          "
          node "$GITHUB_WORKSPACE/scripts/check-contracts.mjs" --root node_modules/@diametral/design-system
